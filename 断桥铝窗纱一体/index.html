<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="安鑫名门专注佛山（禅城/南海/顺德/三水）、广州、江门、东莞断桥铝窗纱一体定制，主营110断桥窗纱一体、金刚网平开窗、封阳台断桥窗，厂家直供，上门测量安装！">

    <meta name="keywords" content="佛山断桥铝窗纱一体,广州封阳台断桥窗,江门断桥铝平开窗,东莞断桥金刚网门窗,南海断桥窗带纱网,顺德隔音断桥窗">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        /* 核心：完整显示图片，不裁剪、不拉伸 */
        .case-img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* 整扇窗完整呈现，不裁上下左右 */
            border-radius: 8px;
            margin-bottom: 6px;
            pointer-events: none;
            user-select: none;
        }
        /* 统一容器高度，排版整齐，空白处补白更整洁 */
        .img-box {
            position: relative;
            overflow: hidden;
            height: 420px; /* 可改450px（更大）/380px（更小），按需调整 */
            background-color: #fff;
            border: 1px solid #f0f0f0; /* 轻微边框，区分图片区域 */
        }
        .img-box::after {content: "安鑫名门"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 36px; color: #000; opacity: 0.2; font-weight: bold; letter-spacing: 4px; z-index: 10;}
        .back-btn {transition: all .3s; background-color: #2563eb; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; display: inline-flex; align-items:center;}
        .back-btn:hover {background-color: #1d4ed8;}
        * {user-select: none; -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none;}
        body {background-color: #f9fafb; padding: 0; margin:0;}
    </style>
</head>
<body>
    <div class="container mx-auto px-4 py-6">
        <!-- 修复返回按钮的HTML语法错误（原代码多了多余的</） -->
        <a href="../index.html" class="back-btn"><i class="fa fa-arrow-left mr-2"></i> 返回案例首页</a>
    </div>
    <div class="container mx-auto px-4 py-2 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="img-box"><img src="110断桥窗纱一体.jpg" alt="佛山110断桥窗纱一体定制，广州江门断桥铝平开窗厂家" class="case-img"></div>
        <div class="img-box"><img src="断桥窗带纱网封窗.jpg" alt="佛山断桥窗带纱网封窗，南海顺德封阳台断桥窗安装" class="case-img"></div>
        <div class="img-box"><img src="断桥窗纱一体封阳台.jpg" alt="佛山断桥窗纱一体封阳台，三水禅城封阳台断桥窗定制" class="case-img"></div> 
        <div class="img-box"><img src="断桥窗纱一体金刚网.jpg" alt="佛山断桥窗纱一体金刚网，广州东莞金刚网断桥铝窗厂家" class="case-img"></div>
        <div class="img-box"><img src="断桥窗纱一体平开窗.jpg" alt="佛山断桥窗纱一体平开窗，江门三水隔音断桥铝平开窗" class="case-img"></div>
        <div class="img-box"><img src="断桥带金刚网隔音.jpg" alt="佛山断桥带金刚网隔音窗，顺德南海断桥铝隔音窗定制" class="case-img"></div>
        <div class="img-box"><img src="断桥铝窗带纱网.jpg" alt="佛山断桥铝窗带纱网，广州东莞断桥铝窗纱网一体安装" class="case-img"></div>
        <div class="img-box"><img src="断桥铝窗纱一体.jpg" alt="佛山断桥铝窗纱一体厂家，江门三水断桥铝门窗定制" class="case-img"></div>
        <div class="img-box"><img src="断桥铝金刚网一体门窗.jpg" alt="佛山断桥铝金刚网一体门窗，广州江门金刚网断桥窗定制" class="case-img"></div>
        <!-- 加图：复制上面整行粘贴，改图片名和ALT属性即可 -->
    </div>
    <script>
        // 适配不同设备，窗始终完整显示
        function debounce(func, wait) {let timeout; return function(...args) {clearTimeout(timeout); timeout = setTimeout(() => func(...args), wait);}}
        const adjustContainers = debounce(() => {
            const screenWidth = window.innerWidth;
            const containers = document.querySelectorAll('.img-box');
            if (screenWidth >= 1024) containers.forEach(c => c.style.height = '420px'); // 电脑端
            else if (screenWidth >= 640) containers.forEach(c => c.style.height = '380px'); // 平板端
            else containers.forEach(c => c.style.height = '320px'); // 手机端
        }, 100);
        window.addEventListener('resize', adjustContainers);
        window.addEventListener('load', adjustContainers);
        // 禁止右键保存
        document.addEventListener('contextmenu', e => e.preventDefault());
    </script>
</body>
</html>
